spring.application.name=dailymotionminer
server.port=8082

logging.level.aiss.dailymotionminer.controller=DEBUG
# Evita que RestTemplate registre el formulario OAuth al activar DEBUG global.
logging.level.org.springframework.web.client.RestTemplate=INFO
logging.level.org.springframework.web.HttpLogging=INFO

dailymotionminer.baseuri=https://api.dailymotion.com

dailymotionminer.maxVideos=10
dailymotionminer.maxComments=10
videominer.uri=http://localhost:8080/videominer/channels

# OAuth 2.0 para las consultas de subtítulos en la API legacy
dailymotionminer.oauth.client-id=${DAILYMOTION_CLIENT_ID:}
dailymotionminer.oauth.client-secret=${DAILYMOTION_CLIENT_SECRET:}
dailymotionminer.oauth.scope=${DAILYMOTION_SCOPE:}
